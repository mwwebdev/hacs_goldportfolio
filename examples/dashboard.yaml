# Beispiel-Dashboard für Gold Portfolio Tracker (ab v2.0.0)
#
# Die Karte findet die Integration automatisch und verwaltet Käufe
# direkt in der Oberfläche - es sind keine Entity-IDs mehr nötig.
title: Gold Portfolio
views:
  - title: Übersicht
    cards:
      # Das ist alles - die Karte konfiguriert sich selbst:
      - type: custom:gold-portfolio-card

      # Optional mit eigenem Titel / ohne Einzelkäufe:
      - type: custom:gold-portfolio-card
        title: Mein Gold
        show_entries: false

      # Die Sensoren stehen weiterhin für Statistik-/Verlaufskarten bereit:
      - type: history-graph
        title: Portfoliowert
        hours_to_show: 720
        entities:
          - sensor.portfolio_current_value
