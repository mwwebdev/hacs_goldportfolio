add_portfolio_entry:
  name: Kauf hinzufügen
  description: Fügt einen neuen Gold-Kauf zum Portfolio hinzu. Ohne Preisangabe wird der historische Goldpreis zum Kaufdatum automatisch ermittelt.
  fields:
    entry_id:
      name: Integration
      description: Config-Entry der Integration (optional, wird automatisch erkannt wenn nur eine existiert)
      required: false
      selector:
        config_entry:
          integration: gold_portfolio
    name:
      name: Bezeichnung
      description: Frei wählbarer Name (z.B. Schmuck, Krügerrand)
      required: false
      selector:
        text:
    purchase_date:
      name: Kaufdatum
      description: Datum des Kaufs
      required: true
      selector:
        date:
    amount_grams:
      name: Menge
      description: Menge in Gramm
      required: true
      selector:
        number:
          min: 0.01
          max: 1000000
          step: 0.01
          unit_of_measurement: g
          mode: box
    purchase_price_eur:
      name: Kaufpreis gesamt
      description: Gesamter Kaufpreis in EUR (optional)
      required: false
      selector:
        number:
          min: 0
          step: 0.01
          unit_of_measurement: EUR
          mode: box
    purchase_price_per_gram:
      name: Kaufpreis pro Gramm
      description: Kaufpreis pro Gramm in EUR (optional, alternativ zum Gesamtpreis)
      required: false
      selector:
        number:
          min: 0
          step: 0.01
          unit_of_measurement: EUR/g
          mode: box

remove_portfolio_entry:
  name: Kauf entfernen
  description: Entfernt einen Kauf aus dem Portfolio (inkl. der zugehörigen Sensoren).
  fields:
    entry_id:
      name: Integration
      description: Config-Entry der Integration (optional)
      required: false
      selector:
        config_entry:
          integration: gold_portfolio
    portfolio_entry_id:
      name: Kauf-ID
      description: ID des Portfolio-Eintrags
      required: true
      selector:
        text:

update_portfolio_entry:
  name: Kauf bearbeiten
  description: Aktualisiert einen bestehenden Kauf.
  fields:
    entry_id:
      name: Integration
      description: Config-Entry der Integration (optional)
      required: false
      selector:
        config_entry:
          integration: gold_portfolio
    portfolio_entry_id:
      name: Kauf-ID
      description: ID des Portfolio-Eintrags
      required: true
      selector:
        text:
    name:
      name: Bezeichnung
      required: false
      selector:
        text:
    purchase_date:
      name: Kaufdatum
      required: false
      selector:
        date:
    amount_grams:
      name: Menge
      required: false
      selector:
        number:
          min: 0.01
          max: 1000000
          step: 0.01
          unit_of_measurement: g
          mode: box
    purchase_price_eur:
      name: Kaufpreis gesamt
      required: false
      selector:
        number:
          min: 0
          step: 0.01
          unit_of_measurement: EUR
          mode: box

get_portfolio_entries:
  name: Käufe abrufen
  description: Gibt alle Portfolio-Einträge als Antwort zurück.
  fields:
    entry_id:
      name: Integration
      description: Config-Entry der Integration (optional)
      required: false
      selector:
        config_entry:
          integration: gold_portfolio

get_historical_price:
  name: Historischen Preis abrufen
  description: Gibt den Goldpreis (EUR pro Unze und pro Gramm) für ein bestimmtes Datum zurück.
  fields:
    entry_id:
      name: Integration
      description: Config-Entry der Integration (optional)
      required: false
      selector:
        config_entry:
          integration: gold_portfolio
    date:
      name: Datum
      required: true
      selector:
        date:
